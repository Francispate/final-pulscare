<!-- PASTE AS: public/patient.html  (replaces the old file)  S8: redesigned "My care" page. Look and layout only; every id and all logic are unchanged. Needs the new public/css/dash.css. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My care | Pulscare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Kannada:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dash.css">
</head>
<body>
<div id="chrome"></div>
<main class="wrap">
  <div class="dash-head">
    <div>
      <span class="tag">My care</span>
      <h1 class="dash-title" id="hello">My care</h1>
      <p class="dash-sub">Doctors marked online can take your request right now.</p>
    </div>
    <div class="dash-actions">
      <span class="badge online hidden" id="online-count" role="status"></span>
      <a class="btn btn-ghost" href="/record.html"><svg class="bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>My medical record</a>
    </div>
  </div>

  <div id="banner"></div>

  <div id="lang-card"></div>

  <div class="seg" role="tablist" aria-label="My care">
    <button class="tab on" id="tab-doctors" role="tab" aria-selected="true" aria-controls="view-doctors">Doctors</button>
    <button class="tab" id="tab-appts" role="tab" aria-selected="false" aria-controls="view-appts" tabindex="-1">My consultations</button>
  </div>

  <section id="view-doctors" role="tabpanel" aria-labelledby="tab-doctors">
    <label class="toggle hidden" id="match-row"><input type="checkbox" id="only-match" checked><span>Show only doctors who speak my language</span></label>
    <div class="doc-grid" id="doctor-grid"><p class="muted">Loading doctors...</p></div>
  </section>

  <section id="view-appts" class="hidden" role="tabpanel" aria-labelledby="tab-appts">
    <div class="appt-list" id="appt-body"><p class="muted">Loading...</p></div>
  </section>
</main>

<!-- Slot booking drawer -->
<div class="drawer-overlay hidden" id="slot-overlay"></div>
<section id="slot-panel" class="drawer hidden" role="dialog" aria-modal="true" aria-labelledby="slot-title" tabindex="-1">
  <div class="drawer-head">
    <h2 id="slot-title">Book a slot</h2>
    <button class="btn btn-ghost btn-sm" id="slot-close" type="button" aria-label="Close slot booking">Close</button>
  </div>
  <div class="drawer-body">
    <p class="small muted">All times are Indian Standard Time (IST). Crossed-out slots are already taken. You can book up to 7 days ahead.</p>
    <div class="day-pills" id="slot-days" role="group" aria-label="Choose a day"></div>
    <div class="slot-grid" id="slot-grid" role="group" aria-label="Choose a time"></div>
  </div>
  <div class="drawer-foot">
    <div class="field"><label for="slot-reason" class="small"><b>Reason for the visit</b> (optional)</label>
      <textarea id="slot-reason" rows="2" maxlength="300" placeholder="For example: fever for two days"></textarea></div>
    <button class="btn btn-primary btn-lg" id="slot-confirm" disabled>Pick a slot</button>
    <div class="msg" id="slot-msg" role="status"></div>
  </div>
</section>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/languages.js"></script>
<script>
  if (!PC.require('patient')) throw new Error('redirect');
  PCUI.mount({ step: 3, active: 'dash' });
  document.getElementById('hello').textContent = 'Hello, ' + PC.user.name.split(' ')[0];

  const suggest = JSON.parse(sessionStorage.getItem('pc_suggest') || 'null');
  let doctors = [], pending = null, countdown = null;
  let myQueue = null, qTimer = null;   // Day 6: my place in a doctor's waiting queue
  const sock = PC.socket();

  let myLangs = [], onlyMatch = true;

  // Small inline icons used in the templates below
  const IC_VIDEO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="13" height="12" rx="3"/><path d="m15 10 6-3v10l-6-3"/></svg>';
  const IC_DOWN = '<svg class="bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>';
  const IC_CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>';

  const initials = (name) => {
    const parts = String(name || '').replace(/^dr\.?\s+/i, '').trim().split(/\s+/).filter(Boolean);
    return ((parts[0] || '?')[0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
  };

  function ranked() {
    const list = doctors.map((d) => ({ d, m: PCLang.match(myLangs, d.languages) }));
    // Best language fit first, then doctors who are online
    list.sort((a, b) => (b.m.all - a.m.all) || (b.m.common.length - a.m.common.length) || (Number(b.d.online) - Number(a.d.online)) || a.d.id.localeCompare(b.d.id));
    return list;
  }

  function renderDoctors() {
    const all = ranked();
    const matched = all.filter((x) => x.m.any);
    const filtering = onlyMatch && myLangs.length > 0;
    const list = filtering && matched.length ? matched : all;
    const note = filtering && !matched.length
      ? `<div class="banner" style="grid-column:1/-1"><b>No doctor speaks ${PC.esc(myLangs.join(' + '))} yet.</b> Showing all doctors. You can use the chat and typed captions during the call.</div>` : '';
    document.getElementById('match-row').classList.toggle('hidden', !myLangs.length);

    const online = doctors.filter((d) => d.online).length;
    const oc = document.getElementById('online-count');
    oc.textContent = online + (online === 1 ? ' doctor' : ' doctors') + ' online';
    oc.classList.toggle('online', online > 0); oc.classList.toggle('offline', online === 0);
    oc.classList.toggle('hidden', !doctors.length);

    document.getElementById('doctor-grid').innerHTML = note + (list.length ? list.map(({ d, m }) => {
      const isSuggested = suggest && suggest.doctorId === d.id;
      const langs = d.languages || [];
      const chips = langs.length
        ? langs.map((l) => `<span class="lc ${m.common.some((c) => c.toLowerCase() === l.toLowerCase()) ? 'match' : ''}">${PC.esc(l)}</span>`).join('')
        : '<span class="small muted">Languages not set</span>';
      const flags = [
        myLangs.length && m.all ? '<span class="badge best">Best match</span>' : '',
        myLangs.length && !m.all && m.any ? `<span class="badge info">Speaks ${PC.esc(m.common.join(' + '))}</span>` : '',
        isSuggested ? '<span class="badge done">Suggested from your survey</span>' : '',
        d.online && d.busy ? `<span class="badge pending">In a call</span><span class="small muted">${d.waiting ? `${d.waiting} waiting` : 'You would be next'}</span>` : ''
      ].join('');
      return `
      <article class="card doc-card ${isSuggested ? 'suggested' : ''}">
        <div class="doc-top">
          <span class="av" aria-hidden="true">${PC.esc(initials(d.name))}</span>
          <div><h3>${PC.esc(d.name)}</h3><span class="dept-tag">${PC.esc(d.department)}</span></div>
          <span class="badge ${d.online ? 'online' : 'offline'}">${d.online ? 'Online' : 'Offline'}</span>
        </div>
        ${flags ? `<div class="doc-flags">${flags}</div>` : ''}
        <div class="qual">${PC.esc(d.qualification)}</div>
        <p class="about" title="${PC.esc(d.about)}">${PC.esc(d.about)}</p>
        <div class="lchips" aria-label="Languages spoken">${chips}</div>
        <div class="doc-foot">
          <div class="doc-fee"><span class="fee">${PC.money(d.fee)}</span><span class="small muted">per consultation</span></div>
          <div class="doc-actions">
            <button class="btn btn-primary" data-doc="${d.id}" ${d.online && !pending && !myQueue ? '' : 'disabled'}>${!d.online ? 'Offline' : myQueue && myQueue.doctorId === d.id ? 'In queue' : d.busy ? 'Join queue' : 'Request consult'}</button>
            <button class="btn btn-ghost" data-slots="${d.id}">Book a slot</button>
          </div>
        </div>
      </article>`;
    }).join('') : '<div class="card empty" style="grid-column:1/-1"><h3>No doctors to show yet</h3><p class="muted">Please check again in a moment.</p></div>');
    document.querySelectorAll('[data-doc]').forEach((b) => b.addEventListener('click', () => request(b.dataset.doc)));
    document.querySelectorAll('[data-slots]').forEach((b) => b.addEventListener('click', () => openSlots(b.dataset.slots, b)));
  }
  document.getElementById('only-match').onchange = (e) => { onlyMatch = e.target.checked; renderDoctors(); };

  async function loadDoctors() { doctors = await PC.api('GET', '/doctors'); renderDoctors(); }

  async function request(doctorId) {
    try {
      const symptoms = suggest ? suggest.symptoms : '';
      const r = await PC.api('POST', '/requests', { doctorId, symptoms });
      if (r.queued) { setQueue({ id: r.queueId, doctorId: r.doctorId, doctorName: r.doctorName, position: r.position, status: r.status, left: r.secondsLeft }); return; }
      pending = { id: r.requestId, doctorName: r.doctorName, left: 120 };
      renderDoctors(); renderBanner();
      clearInterval(countdown);
      countdown = setInterval(() => { if (!pending) return clearInterval(countdown); pending.left--; renderBanner(); if (pending.left <= 0) clearInterval(countdown); }, 1000);
    } catch (e) { alert(e.message); }
  }

  function renderBanner(extra) {
    const b = document.getElementById('banner');
    if (extra) { b.innerHTML = extra; return; }
    if (myQueue) {
      const q = myQueue;
      b.innerHTML = q.status === 'notified'
        ? `<div class="q-strip go" role="alert"><div class="q-main"><span class="q-num" aria-hidden="true">${IC_VIDEO}</span>
            <div class="q-text"><b>${PC.esc(q.doctorName)} is ready. Join now.</b><div>Your turn ends in <b id="q-left"></b>.</div></div></div>
            <span class="row"><button class="btn btn-dark btn-lg" id="q-join">Join now</button><button class="btn btn-ghost btn-sm" id="q-leave">Leave queue</button></span></div>`
        : `<div class="q-strip wait"><div class="q-main"><span class="q-num" aria-hidden="true">#${q.position}</span>
            <div class="q-text"><b>You are #${q.position} in the queue</b><div>${PC.esc(q.doctorName)} is with another patient. Keep this page open. You will get an alert the moment it is your turn.</div></div></div>
            <button class="btn btn-ghost btn-sm" id="q-leave">Leave queue</button></div>`;
      const j = document.getElementById('q-join'); if (j) j.onclick = joinNow;
      const l = document.getElementById('q-leave'); if (l) l.onclick = leaveQueue;
      paintLeft(); return;
    }
    if (!pending) { b.innerHTML = ''; return; }
    const m = Math.floor(pending.left / 60), s = String(pending.left % 60).padStart(2, '0');
    b.innerHTML = `<div class="banner wait"><b>Request sent to ${PC.esc(pending.doctorName)}.</b> Waiting for the doctor to accept. This request expires in ${m}:${s}.</div>`;
  }

  // ---------- Waiting queue (Day 6) ----------
  const fmtLeft = (n) => Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
  function paintLeft() { const el = document.getElementById('q-left'); if (el && myQueue) el.textContent = fmtLeft(Math.max(0, myQueue.left || 0)); }
  function stopQTimer() { clearInterval(qTimer); qTimer = null; }
  function startQTimer(seconds) {
    stopQTimer(); myQueue.left = seconds;
    qTimer = setInterval(() => {
      if (!myQueue) return stopQTimer();
      myQueue.left--; paintLeft();
      if (myQueue.left <= -3) { stopQTimer(); loadMyQueue(); }      // the server decides; this just re-checks
    }, 1000);
  }
  function beep() {
    try {
      const c = new (window.AudioContext || window.webkitAudioContext)();
      [784, 1046, 784, 1046].forEach((f, i) => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = f; g.gain.value = 0.12; o.connect(g); g.connect(c.destination); o.start(c.currentTime + i * 0.22); o.stop(c.currentTime + i * 0.22 + 0.18); });
    } catch (e) { /* sound is optional */ }
  }
  function setQueue(e) {
    const wasNotified = myQueue && myQueue.status === 'notified';
    myQueue = { id: e.id, doctorId: e.doctorId, doctorName: e.doctorName, position: e.position || 1, status: e.status || 'waiting', left: e.left };
    if (myQueue.status === 'notified') { startQTimer(e.left != null ? e.left : 120); document.title = 'Doctor is ready! | Pulscare'; if (!wasNotified) beep(); }
    else { stopQTimer(); document.title = 'My care | Pulscare'; }
    renderDoctors(); renderBanner();
  }
  function clearQueueUi(message) { stopQTimer(); myQueue = null; document.title = 'My care | Pulscare'; renderDoctors(); renderBanner(message); }
  async function loadMyQueue() {
    try {
      const r = await PC.api('GET', '/queue/mine');
      if (r.entry) setQueue({ id: r.entry.queueId, doctorId: r.entry.doctorId, doctorName: r.entry.doctorName, position: r.entry.position, status: r.entry.status, left: r.entry.secondsLeft });
      else if (myQueue) clearQueueUi(`<div class="banner"><b>Your turn has passed.</b> You can join the queue again.</div>`);
    } catch (e) { /* ignore */ }
  }
  async function joinNow() {
    if (!myQueue) return;
    const b = document.getElementById('q-join'); if (b) b.disabled = true;
    try { const r = await PC.api('POST', `/queue/${myQueue.id}/join`); location.href = `/consult.html?a=${r.appointmentId}`; }
    catch (e) { alert(e.message); loadMyQueue(); }
  }
  async function leaveQueue() {
    if (!myQueue) return;
    try { await PC.api('POST', `/queue/${myQueue.id}/leave`); } catch (e) { /* already gone */ }
    clearQueueUi(`<div class="banner"><b>You left the queue.</b></div>`);
  }

  // ---------- Slot booking ----------
  const IST = 'Asia/Kolkata';
  const fmtDate = (iso) => new Date(iso).toLocaleDateString('en-IN', { timeZone: IST, weekday: 'short', day: 'numeric', month: 'short' });
  const fmtTime = (iso) => new Date(iso).toLocaleTimeString('en-IN', { timeZone: IST, hour: 'numeric', minute: '2-digit' });
  const fmtFull = (iso) => new Date(iso).toLocaleString('en-IN', { timeZone: IST, weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  const dayLabel = (date) => fmtDate(date + 'T12:00:00+05:30');
  let slotDoc = null, slotData = null, slotDay = null, slotPick = null, slotOpener = null;
  const slotMsg = (t, k) => { const m = document.getElementById('slot-msg'); m.textContent = t || ''; m.className = 'msg ' + (k || ''); };

  // The slot panel is a side drawer (bottom sheet on phones)
  function showSlotPanel(on) {
    const panel = document.getElementById('slot-panel');
    panel.classList.toggle('hidden', !on);
    document.getElementById('slot-overlay').classList.toggle('hidden', !on);
    document.body.classList.toggle('drawer-open', on);
    if (on) document.getElementById('slot-close').focus();
    else if (slotOpener && document.body.contains(slotOpener)) slotOpener.focus();
  }
  function closeSlots() { showSlotPanel(false); slotDoc = null; slotPick = null; }

  async function openSlots(doctorId, opener) {
    slotDoc = doctors.find((d) => d.id === doctorId); if (!slotDoc) return;
    slotOpener = opener || null;
    slotPick = null; slotDay = null; slotMsg('');
    document.getElementById('slot-title').textContent = 'Book a slot with ' + slotDoc.name;
    showSlotPanel(true);
    await loadSlots();
  }

  async function loadSlots() {
    if (!slotDoc) return;
    try { slotData = await PC.api('GET', `/doctors/${slotDoc.id}/slots`); }
    catch (e) { slotMsg(e.message, 'err'); return; }
    if (!slotData.days.some((d) => d.date === slotDay)) {
      const firstFree = slotData.days.find((d) => d.slots.some((s) => !s.booked));
      slotDay = (firstFree || slotData.days[0] || {}).date || null;
    }
    if (slotPick && !slotData.days.some((d) => d.slots.some((s) => s.id === slotPick.id && !s.booked))) {
      slotPick = null; slotMsg('The slot you picked was just taken. Please choose another.', 'err');
    }
    renderSlots();
  }

  function renderSlots() {
    const days = document.getElementById('slot-days'), grid = document.getElementById('slot-grid'), btn = document.getElementById('slot-confirm');
    if (!slotData.days.length) {
      days.innerHTML = ''; grid.innerHTML = '<p class="muted small" style="grid-column:1/-1">This doctor has no open slots in the next 7 days.</p>';
      btn.disabled = true; btn.textContent = 'No slots available'; return;
    }
    days.innerHTML = slotData.days.map((d) => `<button type="button" class="pill ${d.date === slotDay ? 'on' : ''}" data-day="${d.date}" aria-pressed="${d.date === slotDay}"><b>${PC.esc(dayLabel(d.date))}</b><small>${d.slots.filter((s) => !s.booked).length} free</small></button>`).join('');
    days.querySelectorAll('[data-day]').forEach((b) => b.addEventListener('click', () => { slotDay = b.dataset.day; renderSlots(); }));
    const day = slotData.days.find((d) => d.date === slotDay);
    grid.innerHTML = day.slots.map((s) => `<button type="button" class="slot-btn ${s.mine ? 'mine' : ''} ${slotPick && slotPick.id === s.id ? 'on' : ''}" data-slot="${s.id}" aria-pressed="${!!(slotPick && slotPick.id === s.id)}" ${s.booked ? 'disabled' : ''}>${PC.esc(fmtTime(s.startsAt))}${s.mine ? '<div class="small">Yours</div>' : ''}</button>`).join('');
    grid.querySelectorAll('[data-slot]').forEach((b) => b.addEventListener('click', () => {
      slotPick = day.slots.find((s) => s.id === b.dataset.slot); slotMsg(''); renderSlots();
    }));
    btn.disabled = !slotPick;
    btn.textContent = slotPick ? `Book ${fmtFull(slotPick.startsAt)} IST` : 'Pick a slot';
  }

  document.getElementById('slot-close').onclick = closeSlots;
  document.getElementById('slot-overlay').onclick = closeSlots;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !document.getElementById('slot-panel').classList.contains('hidden')) closeSlots(); });
  document.getElementById('slot-confirm').onclick = async () => {
    if (!slotPick) return;
    const btn = document.getElementById('slot-confirm'); btn.disabled = true; slotMsg('Booking...');
    try {
      const r = await PC.api('POST', `/slots/${slotPick.id}/book`, { reason: document.getElementById('slot-reason').value });
      slotOpener = null; showSlotPanel(false);
      document.getElementById('slot-reason').value = '';
      slotDoc = null; slotPick = null; slotMsg('');
      renderBanner(`<div class="banner go"><b>Booked with ${PC.esc(r.doctorName)} for ${PC.esc(fmtFull(r.startsAt))} IST.</b> The room opens 10 minutes before your slot. You can find it under My consultations.</div>`);
      setTab(true);
    } catch (e) {
      slotMsg(e.message, 'err'); slotPick = null;
      await loadSlots();
      slotMsg(e.message, 'err');
    }
  };

  async function cancelSlot(slotId) {
    if (!confirm('Cancel this booking? The slot becomes free for other patients.')) return;
    try { await PC.api('POST', `/slots/${slotId}/cancel`); loadAppts(); if (slotDoc) loadSlots(); }
    catch (e) { alert(e.message); loadAppts(); }
  }
  window.cancelSlot = cancelSlot;

  async function loadAppts() {
    const rows = await PC.api('GET', '/appointments');
    const body = document.getElementById('appt-body');
    if (!rows.length) {
      body.innerHTML = `<div class="card empty"><span class="ic">${IC_CAL}</span><h3>No consultations yet</h3><p class="muted">Choose an online doctor, or book a slot for later.</p><button class="btn btn-primary" id="empty-find" type="button">Find a doctor</button></div>`;
      document.getElementById('empty-find').onclick = () => setTab(false);
      return;
    }
    const now = Date.now();
    body.innerHTML = rows.map((a) => {
      let status, action;
      const startMs = a.slot_starts_at ? new Date(a.slot_starts_at).getTime() : 0;
      if (a.status === 'completed') {
        status = '<span class="badge done">Completed and paid</span>';
        action = `<button class="btn btn-ghost btn-sm" onclick="PC.openDoc('${a.id}','prescription')">${IC_DOWN}Prescription</button>
                  <button class="btn btn-ghost btn-sm" onclick="PC.openDoc('${a.id}','invoice')">${IC_DOWN}Invoice ${PC.esc(a.invoice_no || '')}</button>`;
      } else if (a.status === 'awaiting_payment') {
        status = '<span class="badge pending">Awaiting payment</span>';
        action = `<a class="btn btn-primary btn-sm" href="/payment.html?a=${a.id}">Pay now</a>`;
      } else if (a.slot_id && a.status === 'booked' && now < startMs - 600000) {
        status = '<span class="badge pending">Slot booked</span>';
        action = `<span class="small muted">Room opens at ${PC.esc(fmtTime(new Date(startMs - 600000).toISOString()))}</span>
                  ${now < startMs ? `<button class="btn btn-ghost btn-sm" onclick="cancelSlot('${a.slot_id}')">Cancel</button>` : ''}`;
      } else {
        status = `<span class="badge pending">${a.status === 'booked' ? 'Ready to join' : 'In progress'}</span>`;
        action = `<a class="btn btn-primary btn-sm" href="/consult.html?a=${a.id}">Join call</a>
                  ${a.slot_id && a.status === 'booked' && now < startMs ? `<button class="btn btn-ghost btn-sm" onclick="cancelSlot('${a.slot_id}')">Cancel</button>` : ''}`;
      }
      const when = a.slot_starts_at ? `<b>${PC.esc(fmtFull(a.slot_starts_at))}</b><div class="small muted">Booked slot (IST)${a.reason ? ' · ' + PC.esc(a.reason) : ''}</div>`
        : `<b>${PC.esc(new Date(a.created_at).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }))}</b><div class="small muted">Video consultation</div>`;
      return `<article class="appt">
        <span class="av" aria-hidden="true">${PC.esc(initials(a.doctor_name))}</span>
        <div class="appt-who"><b>${PC.esc(a.doctor_name)}</b><div class="small muted">${PC.esc(a.department)} · ${PC.money(a.fee)}</div></div>
        <div class="appt-when small">${when}</div>
        <div class="appt-status">${status}</div>
        <div class="appt-actions"><div class="row">${action}</div></div></article>`;
    }).join('');
  }

  sock.on('queue:state', ({ doctorId, busy, waiting }) => { const d = doctors.find((x) => x.id === doctorId); if (d) { d.busy = busy; d.waiting = waiting; renderDoctors(); } });
  sock.on('queue:update', (u) => {
    if (!myQueue || u.queueId !== myQueue.id) return;
    if (u.status === 'waiting' || u.status === 'notified') {
      const was = myQueue.status; myQueue.position = u.position;
      if (u.status === 'notified' && was !== 'notified') setQueue({ ...myQueue, status: 'notified', left: u.secondsLeft }); else { myQueue.status = u.status; renderBanner(); }
      return;
    }
    const name = myQueue.doctorName;
    clearQueueUi(u.status === 'expired'
      ? `<div class="banner"><b>Your turn with ${PC.esc(name)} passed</b> because you did not join in time. You can join the queue again.</div>`
      : u.reason === 'doctor' ? `<div class="banner"><b>${PC.esc(name)} removed you from the queue.</b> You can choose another doctor.</div>`
      : `<div class="banner"><b>${PC.esc(name)} went offline, so the queue was closed.</b> You can choose another doctor.</div>`);
  });
  sock.on('queue:turn', (t) => {
    setQueue({ id: t.queueId, doctorId: t.doctorId, doctorName: t.doctorName, position: 1, status: 'notified', left: t.seconds });
  });
  sock.on('slot:update', ({ doctorId }) => { if (slotDoc && slotDoc.id === doctorId) loadSlots(); });
  sock.on('slot:cancelled', (c) => {
    renderBanner(`<div class="banner"><b>Your visit on ${PC.esc(fmtFull(c.startsAt))} IST was cancelled by the doctor.</b> You can book another slot.</div>`);
    loadAppts();
  });
  setInterval(() => { if (!document.getElementById('view-appts').classList.contains('hidden')) loadAppts().catch(() => {}); }, 30000);
  sock.on('presence:update', ({ doctorId, online }) => { const d = doctors.find((x) => x.id === doctorId); if (d) { d.online = online; renderDoctors(); } });
  sock.on('request:update', (u) => {
    if (!pending || u.requestId !== pending.id) return;
    clearInterval(countdown);
    const name = pending.doctorName; pending = null; renderDoctors();
    if (u.status === 'accepted') {
      renderBanner(`<div class="banner go"><div class="row spread"><span><b>${PC.esc(name)} accepted your request.</b> Your private room is ready.</span>
        <a class="btn btn-primary btn-sm" href="/consult.html?a=${u.appointmentId}">Join call</a></div></div>`);
      loadAppts();
    } else renderBanner(`<div class="banner"><b>${PC.esc(name)} ${u.status === 'rejected' ? 'is unable to take this request.' : 'did not respond in time.'}</b> You can choose another doctor.</div>`);
  });

  function setTab(appts) {
    const td = document.getElementById('tab-doctors'), ta = document.getElementById('tab-appts');
    td.classList.toggle('on', !appts); ta.classList.toggle('on', appts);
    td.setAttribute('aria-selected', String(!appts)); ta.setAttribute('aria-selected', String(appts));
    td.tabIndex = appts ? -1 : 0; ta.tabIndex = appts ? 0 : -1;
    document.getElementById('view-doctors').classList.toggle('hidden', appts); document.getElementById('view-appts').classList.toggle('hidden', !appts);
    if (appts) loadAppts();
  }
  document.getElementById('tab-doctors').onclick = () => setTab(false);
  document.getElementById('tab-appts').onclick = () => setTab(true);
  document.querySelector('.seg').addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const toAppts = e.key === 'ArrowRight'; setTab(toAppts);
    document.getElementById(toAppts ? 'tab-appts' : 'tab-doctors').focus();
  });
  if (location.hash === '#appts') setTab(true);

  (async () => {
    myLangs = await PCLang.get();
    // Asks for languages straight after login; afterwards it shows them with a Change button
    PCLang.mountEditor(document.getElementById('lang-card'), { role: 'patient', current: myLangs, startOpen: !myLangs.length,
      onSaved: (l) => { myLangs = l; onlyMatch = true; document.getElementById('only-match').checked = true; renderDoctors(); } });
    await loadDoctors();
    loadMyQueue();
  })();
  loadAppts();
</script>
</body>
</html>
